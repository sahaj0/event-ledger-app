spring:
  application:
    name: account-service
  datasource:
    url: jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0   # sample every request: every call must be traceable

# Structured (JSON) logs. The ECS format carries @timestamp, log.level, service.name and the
# MDC entries (traceId / spanId) that Micrometer Tracing puts there.
logging:
  structured:
    format:
      console: ecs
