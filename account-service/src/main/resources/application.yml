spring:
  application:
    name: account-service
  datasource:
    # In-memory by default. Set ACCOUNT_DB_URL=jdbc:h2:file:./data/accountdb to keep the ledger across restarts.
    url: ${ACCOUNT_DB_URL:jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1}
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0   # sample every request: every call must be traceable
  # Export spans to Zipkin (UI: http://localhost:9411). Off by default so nothing is sent unless a Zipkin is running:
  #   ZIPKIN_ENABLED=true  [ZIPKIN_ENDPOINT=http://localhost:9411/api/v2/spans]
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
      export:
        enabled: ${ZIPKIN_ENABLED:false}

# Structured (JSON) logs. The ECS format carries @timestamp, log.level, service.name and the
# MDC entries (traceId / spanId) that Micrometer Tracing puts there.
logging:
  structured:
    format:
      console: ecs
