# Config for the Account Service when booted inside the integration test JVM.
# (Selected with --spring.config.name=it-account, so the service's own application.yml,
#  which would collide with the Gateway's on this shared classpath, is not used.)
spring:
  application:
    name: account-service
  datasource:
    url: jdbc:h2:mem:it-accountdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      export:
        enabled: false   # no Zipkin in the test JVM
